<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/perfil.css" />
</head>
<body>
    <div class="perfil-container">
        <div class="header-logos">
            <img src="img/logo-innova-blanco.png" alt="Logo Innova Blanco" class="header-logo" />
            <img src="img/logo-muni-blanco.png" alt="Logo Municipalidad" class="header-logo" />
        </div>
        <h2>Mi Perfil</h2>
        <img src="img/user.png" alt="Foto de perfil" class="perfil-foto" id="perfilFoto" />
        <input type="file" accept="image/*" id="fotoInput" class="hidden-input" />
        
        <!-- Contenedor de botones lado a lado -->
        <div style="display: flex; gap: 10px; justify-content: center; align-items: center; width: 100%; margin-bottom: 12px;">
            <button class="perfil-foto-btn" onclick="document.getElementById('fotoInput').click()">CAMBIAR FOTO</button>
            <button class="perfil-foto-btn mis-reclamos-btn" onclick="location.href='mis-reclamos.html'">MIS RECLAMOS</button>
        </div>
        
        <div class="perfil-info" id="perfilInfo">
            <strong>Nombre:</strong> <span id="nombreUsuario">Cargando...</span><br>
            <strong>Email:</strong> <span id="emailUsuario">Cargando...</span><br>
            <strong>RUT:</strong> <span id="rutUsuario">Cargando...</span>
        </div>
        <div class="docs-section">
            <div class="docs-title">DOCUMENTOS</div>
            <div class="docs-list">
                <div class="doc-item reglamento-item">
                    <span class="doc-name">📄 Reglamento de Convivencia</span>
                    <div class="doc-actions">
                        <button onclick="abrirReglamento()" class="doc-link reglamento-btn">Ver PDF</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="home-btn-container">
        <button class="home-btn" onclick="location.href='home.html'">Volver a Inicio</button>
    </div>
    <script src="js/api.js"></script>
    <script src="js/behaviour.js"></script>
    <script>
        // Cargar datos del usuario al cargar la página
        window.addEventListener('load', function() {
            cargarDatosUsuario();
            cargarFotoPerfil();
        });
        
        async function cargarDatosUsuario() {
            try {
                // Primero intentar obtener datos del localStorage
                const userEmail = localStorage.getItem('userEmail');
                const userName = localStorage.getItem('userName');
                const userRut = localStorage.getItem('userRut');
                
                if (userEmail || userName) {
                    // Si hay datos en localStorage, mostrarlos
                    document.getElementById('nombreUsuario').textContent = userName || 'No disponible';
                    document.getElementById('emailUsuario').textContent = userEmail || 'No disponible';
                    document.getElementById('rutUsuario').textContent = userRut || 'No disponible';
                } else {
                    // Si no hay datos en localStorage, intentar obtener de la API
                    const userId = localStorage.getItem('userId') || sessionStorage.getItem('userId');
                    
                    if (userId) {
                        const userData = await get_users(userId);
                        
                        if (userData && userData.length > 0) {
                            const usuario = userData[0];
                            
                            document.getElementById('nombreUsuario').textContent = usuario.nombre || 'No disponible';
                            document.getElementById('emailUsuario').textContent = usuario.email || 'No disponible';
                            document.getElementById('rutUsuario').textContent = usuario.rut || 'No disponible';
                        } else {
                            mostrarDatosNoDisponibles();
                        }
                    } else {
                        mostrarDatosNoDisponibles();
                    }
                }
            } catch (error) {
                console.error('Error al cargar datos del usuario:', error);
                mostrarDatosNoDisponibles();
            }
        }
        
        function mostrarDatosNoDisponibles() {
            document.getElementById('nombreUsuario').textContent = 'No disponible';
            document.getElementById('emailUsuario').textContent = 'No disponible';
            document.getElementById('rutUsuario').textContent = 'No disponible';
        }

        // Función para cargar la foto de perfil guardada
        function cargarFotoPerfil() {
            const userId = localStorage.getItem('userId') || sessionStorage.getItem('userId') || 'default';
            const fotoGuardada = localStorage.getItem(`perfil_foto_${userId}`);
            
            if (fotoGuardada) {
                document.getElementById('perfilFoto').src = fotoGuardada;
            }
        }

        // Función para guardar la foto de perfil
        function guardarFotoPerfil(fotoDataURL) {
            const userId = localStorage.getItem('userId') || sessionStorage.getItem('userId') || 'default';
            localStorage.setItem(`perfil_foto_${userId}`, fotoDataURL);
            
            // Mostrar mensaje de confirmación
            mostrarNotificacion('Foto de perfil guardada correctamente', 'success');
        }

        // Foto de perfil modificable
        const fotoInput = document.getElementById('fotoInput');
        const perfilFoto = document.getElementById('perfilFoto');
        fotoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // Validar que sea una imagen
                if (!file.type.startsWith('image/')) {
                    mostrarNotificacion('Por favor, selecciona un archivo de imagen válido', 'error');
                    return;
                }
                
                // Validar tamaño (máximo 5MB)
                if (file.size > 5 * 1024 * 1024) {
                    mostrarNotificacion('La imagen es muy grande. Máximo 5MB permitido', 'error');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(ev) {
                    perfilFoto.src = ev.target.result;
                    guardarFotoPerfil(ev.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        // Función para abrir el reglamento de convivencia
        function abrirReglamento() {
            // Crear un enlace temporal y hacer click para abrir el PDF
            const enlace = document.createElement('a');
            enlace.href = 'docs/Reglamento de Convivencia_JS1.pdf';
            enlace.target = '_blank';
            enlace.rel = 'noopener noreferrer';
            
            // Para dispositivos móviles, intentar abrir directamente
            if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
                // En móviles, abrir en nueva pestaña/ventana
                window.open(enlace.href, '_blank', 'noopener,noreferrer');
            } else {
                // En escritorio, usar el método tradicional
                document.body.appendChild(enlace);
                enlace.click();
                document.body.removeChild(enlace);
            }
            
            // Mostrar notificación
            mostrarNotificacion('Abriendo Reglamento de Convivencia...', 'info');
        }





        // Función para mostrar notificaciones
        function mostrarNotificacion(mensaje, tipo = 'info') {
            // Remover notificación previa si existe
            const existingNotification = document.querySelector('.profile-notification');
            if (existingNotification) {
                existingNotification.remove();
            }

            // Crear nueva notificación
            const notification = document.createElement('div');
            notification.className = `profile-notification notification-${tipo}`;
            notification.textContent = mensaje;
            
            document.body.appendChild(notification);

            // Remover la notificación después de 4 segundos
            setTimeout(() => {
                notification.classList.add('notification-exit');
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 300);
            }, 4000);
        }
    </script>
</body>
</html>
