<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página de Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@100&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/home.css" />
</head>
<body>
    
    <div id="content-container">
        
        <div class="button-container">
            <button class="emergency-button" onclick="location.href='reclamo.html'" width="80%">
                <img src="img/studying-unscreen.gif" alt="Reclamos" width="40px"/>
                <span>RECLAMOS<br>SUGERENCIAS</span>
            </button>
            <button class="news-button" onclick="location.href='avisos.html'" width="40px">
                <img src="img/megaphone-unscreen.gif" alt="Noticias" width="40px"/>
                AVISOS
            </button>
        </div>
        
        <!-- Logos movidos abajo -->
        <div class="footer-logos">
            <img src="img/LogoRecortadoa.png" alt="Logo Recortadoa" class="footer-logo footer-logo-recortado" width="30%"/>
            <img src="img/logo-muni-gris.png" alt="Logo Municipalidad" class="footer-logo footer-logo-muni" width="30%"/>
        </div>
        
        <!-- Botón hamburguesa movido abajo a la derecha -->
        <div class="hamburger-container-bottom">
            <button class="hamburger-btn" onclick="toggleMenu()">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
    </div>
    
    <!-- Menú lateral -->
    <div id="side-menu" class="side-menu">
        <div class="menu-content">
            <button class="menu-item" onclick="quienesSomos()">
                QUIENES SOMOS
            </button>
            <button class="menu-item" onclick="location.href='perfil.html'">
                MI PERFIL
            </button>
            <button class="menu-item" onclick="cerrarSesion()">
                CERRAR SESIÓN
            </button>
        </div>
    </div>
    
    <!-- Overlay para cerrar el menú -->
    <div id="menu-overlay" class="menu-overlay" onclick="closeMenu()"></div>
<script>
    const images = document.querySelectorAll('.carousel-bg-image');
    let current = 0;
    function showImage(idx) {
      images.forEach((img, i) => {
        img.classList.toggle('active', i === idx);
      });
    }
    function nextImage() {
      current = (current + 1) % images.length;
      showImage(current);
    }
    showImage(current);
    setInterval(nextImage, 3000);
    
    // Funciones del menú hamburguesa
    function toggleMenu() {
        const menu = document.getElementById('side-menu');
        const overlay = document.getElementById('menu-overlay');
        const hamburgerBtn = document.querySelector('.hamburger-btn');
        
        menu.classList.toggle('active');
        overlay.classList.toggle('active');
        hamburgerBtn.classList.toggle('active');
    }
    
    function closeMenu() {
        const menu = document.getElementById('side-menu');
        const overlay = document.getElementById('menu-overlay');
        const hamburgerBtn = document.querySelector('.hamburger-btn');
        
        menu.classList.remove('active');
        overlay.classList.remove('active');
        hamburgerBtn.classList.remove('active');
    }
    
    function quienesSomos() {
        closeMenu();
        // Redirigir a la página de Quienes Somos
        window.location.href = 'quienes-somos.html';
    }
    
    function cerrarSesion() {
        closeMenu();
        // Limpiar datos del localStorage
        localStorage.removeItem('userId');
        localStorage.removeItem('userEmail');
        localStorage.removeItem('userName');
        localStorage.removeItem('userPhone');
        localStorage.removeItem('userRut');
        
        // Redirigir a la página index
        window.location.href = 'index.html';
    }
    
    // Cerrar menú con tecla Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeMenu();
        }
    });

    // Función para cargar imágenes de fondo con fallback
    function loadBackgroundImages() {
        const bgImages = document.querySelectorAll('.carousel-bg-image[data-bg-image]');
        
        bgImages.forEach(function(element) {
            const imageName = element.getAttribute('data-bg-image');
            const primaryPath = 'img/' + imageName;
            const fallbackPath = 'img/FONDOS/' + imageName;
            
            // Crear una imagen temporal para verificar si existe
            const testImage = new Image();
            
            testImage.onload = function() {
                // Si la imagen se carga exitosamente, usarla
                element.style.backgroundImage = 'url("' + primaryPath + '")';
            };
            
            testImage.onerror = function() {
                // Si falla, intentar con el fallback
                const fallbackImage = new Image();
                
                fallbackImage.onload = function() {
                    element.style.backgroundImage = 'url("' + fallbackPath + '")';
                };
                
                fallbackImage.onerror = function() {
                    console.warn('No se pudo cargar la imagen:', imageName);
                    // Usar un color de fondo por defecto
                    element.style.background = 'linear-gradient(135deg, #1E3A8A, #1E40AF)';
                };
                
                fallbackImage.src = fallbackPath;
            };
            
            testImage.src = primaryPath;
        });
    }

    // Cargar las imágenes cuando la página esté lista
    document.addEventListener('DOMContentLoaded', loadBackgroundImages);
</script>
</body>
</html>
