<!DOCTYPE html>
<html>
    <head>
        <meta    </head>
    <body onload="buscar_tipo_reclamo()">
        <div class="reclamo-container" style="z-index: 1;">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Justicia-Sociapp</title>
        <link rel="icon" type="image/png" href="img/JS sin fondo.png">
        <link rel="stylesheet" href="css/index.css">
        <link rel="stylesheet" href="css/reclamo.css">
        <style>
            /* Estilos para la sección de archivos adjuntos */
            #archivos-section {
                transition: all 0.3s ease;
            }
            
            #archivos-section button {
                transition: background-color 0.2s ease;
            }
            
            #archivos-section button:hover {
                opacity: 0.9;
                transform: translateY(-1px);
            }
            
            .archivo-item {
                animation: slideInFile 0.3s ease-out;
            }
            
            @keyframes slideInFile {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            
            /* Mejorar la apariencia del input file */
            #archivos-input {
                transition: border-color 0.2s ease;
            }
            
            #archivos-input:focus {
                outline: none;
                border-color: #129be5;
                box-shadow: 0 0 0 2px rgba(18, 155, 229, 0.2);
            }
        </style>
    </head>
    <body onload="buscar_tipo_reclamo()">
        <div class="reclamo-container" style="z-index: 1;">
            <div style="margin-top: 10px; padding-bottom: 20px;">
                <P>TIPO DE RECLAMO</P> 
                <select id="reclamo-type">
                </select>
                <p style="margin-top: 5px; margin-bottom: 10px;">Describa ABAJO su situación:</p>
                <textarea id="reclamo" type="text" placeholder="Reclamo" autocomplete="reclamo" rows="8" cols="40" required></textarea>
                <input type="text" id="reclamo2" style="color: #a5a4a4">

                <!-- Sección de archivos adjuntos - Dropdown -->
                <div id="archivos-dropdown" style="margin-top: 15px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; background: #f9f9f9;">
                    <div id="archivos-header" onclick="toggleArchivosDropdown()" style="padding: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; color: #333;">
                        <span>ADJUNTAR ARCHIVOS (OPCIONAL)</span>
                        <svg id="archivos-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transition: transform 0.3s ease;">
                            <polyline points="6,9 12,15 18,9"></polyline>
                        </svg>
                    </div>
                    <div id="archivos-content" style="display: none; padding: 0 12px 12px 12px; border-top: 1px solid #ddd;">
                        <input type="file" id="archivos-input" accept="application/pdf,.pdf,image/*" multiple style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; margin-bottom: 8px; margin-top: 8px;">
                        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                            <button onclick="adjuntarArchivos()" style="background: #129be5; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;">Adjuntar</button>
                            <button onclick="limpiarArchivos()" style="background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;">Limpiar</button>
                        </div>
                        <div style="font-size: 11px; color: #666; margin-bottom: 8px;">Formatos: PDF e Imágenes (máx. 5MB c/u)</div>
                        <div id="archivos-lista" style="max-height: 120px; overflow-y: auto;">
                            <!-- Lista de archivos adjuntos -->
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 8px; justify-content: space-between; margin-top: 10px; width: 100%; box-sizing: border-box;">
                    <div onclick="cancelar()" style="width: 47%; font-size: 10px; padding: 8px 5px; background: #e51212; color: white; border: none; border-radius: 7px; cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 32px; font-weight: 600;">CANCELAR</div>
                    <div onclick="envia_reclamo()" style="width: 47%; font-size: 10px; padding: 8px 5px; background: #129be5; color: white; border: none; border-radius: 7px; cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 32px; font-weight: 600;">ENVIAR</div>
                </div>
                
                <div id="reclamo-confirmation" class="reclamo-confirmation" style="display:hidden; flex-direction: column; text-align: center;">
                    <span>Su reclamo ha sido enviado</span>
                    <img src="img/aprobado.png" alt="Aprobado" class="aprobado-icon" />
                </div>
                
                <!-- Contenedor horizontal para botón home y micrófono -->
                <div style="display: flex; align-items: center; justify-content: center; gap: 40px; margin-top: 20px; margin-bottom: 20px;">
                    <!-- Botón home a la izquierda -->
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <a href="home.html" class="home-icon" aria-label="Ir al inicio" style="z-index: 10; margin-bottom: 8px;">
                            <span style="display: inline-block; position: relative; width: 56px; height: 56px;">
                                <svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" style="position: absolute; top: 0; left: 0;"><circle cx="28" cy="28" r="28" fill="white"/></svg>
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; top: 14px; left: 14px;"><path d="M3 12L12 3l9 9"/><path d="M9 21V9h6v12"/></svg>
                            </span>
                        </a>
                        <span style="color: #1E3A8A; font-size: 12px; font-weight: bold; text-align: center;">volver al inicio</span>
                    </div>
                    
                    <!-- Micrófono a la derecha -->
                    <div style="display: flex; flex-direction: column; align-items: center;">
                        <div class="mic-container" id="mic-container" onclick="toggleRecording()" style="cursor: pointer; margin-bottom: 8px;">
                            <img src="img/microphone.png" width="60" id="mic-icon">
                            <span id="recording-text" style="display:none; color: #00cc00; font-weight: bold; margin-top: 4px;">grabando</span>
                        </div>
                        <span style="color: #1E3A8A; font-size: 12px; font-weight: bold; text-align: center;">grabar audio</span>
                    </div>
                </div>
            </div>
        </div>
        <script src="cordova.js"></script>
        <script src="js/api.js"></script>
        <script src="js/behaviour.js"></script>
        <script>
            let isRecording = false;
            let archivosAdjuntos = []; // Array para almacenar archivos adjuntos

            // Función para manejar el dropdown de archivos
            function toggleArchivosDropdown() {
                const content = document.getElementById('archivos-content');
                const chevron = document.getElementById('archivos-chevron');
                
                if (content.style.display === 'none' || content.style.display === '') {
                    content.style.display = 'block';
                    chevron.style.transform = 'rotate(180deg)';
                } else {
                    content.style.display = 'none';
                    chevron.style.transform = 'rotate(0deg)';
                }
            }

            // Funciones para manejo de archivos adjuntos
            function adjuntarArchivos() {
                const archivosInput = document.getElementById('archivos-input');
                
                if (archivosInput.files.length === 0) {
                    alert('Por favor, selecciona al menos un archivo');
                    return;
                }
                
                for (const file of archivosInput.files) {
                    const esPDF = file.type === 'application/pdf';
                    const esImagen = file.type.startsWith('image/');
                    
                    if (esPDF || esImagen) {
                        // Validar tamaño (máximo 5MB por archivo)
                        if (file.size > 5 * 1024 * 1024) {
                            alert(`El archivo ${file.name} es muy grande. Máximo 5MB por archivo`);
                            continue;
                        }
                        
                        // Verificar si el archivo ya está adjuntado
                        if (archivosAdjuntos.find(archivo => archivo.nombre === file.name)) {
                            alert(`El archivo ${file.name} ya está adjuntado`);
                            continue;
                        }
                        
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const archivo = {
                                nombre: file.name,
                                tipo: esPDF ? 'pdf' : 'imagen',
                                data: ev.target.result,
                                size: file.size,
                                fechaAdjunto: new Date().toISOString()
                            };
                            
                            archivosAdjuntos.push(archivo);
                            actualizarListaArchivos();
                            guardarArchivosReclamo();
                        };
                        reader.readAsDataURL(file);
                    } else {
                        alert(`El archivo ${file.name} no es un formato válido (PDF o imagen)`);
                    }
                }
                
                archivosInput.value = ''; // Limpiar input
            }
            
            function actualizarListaArchivos() {
                const lista = document.getElementById('archivos-lista');
                lista.innerHTML = '';
                
                if (archivosAdjuntos.length === 0) {
                    lista.innerHTML = '<div style="color: #666; font-size: 12px; font-style: italic;">No hay archivos adjuntos</div>';
                    return;
                }
                
                archivosAdjuntos.forEach((archivo, index) => {
                    const icono = archivo.tipo === 'pdf' ? '📄' : '🖼️';
                    const sizeKB = Math.round(archivo.size / 1024);
                    
                    const div = document.createElement('div');
                    div.className = 'archivo-item';
                    div.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; margin-bottom: 4px; background: white; border-radius: 4px; border: 1px solid #e0e0e0;';
                    div.innerHTML = `
                        <div style="flex: 1; font-size: 12px;">
                            <span>${icono} ${archivo.nombre}</span>
                            <span style="color: #666; margin-left: 8px;">(${sizeKB}KB)</span>
                        </div>
                        <div style="display: flex; gap: 4px;">
                            <button onclick="verArchivo(${index})" style="background: #17a2b8; color: white; border: none; padding: 2px 6px; border-radius: 3px; font-size: 10px; cursor: pointer;" title="Ver archivo">Ver</button>
                            <button onclick="eliminarArchivo(${index})" style="background: #dc3545; color: white; border: none; padding: 2px 6px; border-radius: 3px; font-size: 10px; cursor: pointer;" title="Eliminar archivo">×</button>
                        </div>
                    `;
                    lista.appendChild(div);
                });
                
                // Mostrar contador de archivos
                const contador = archivosAdjuntos.length;
                const contadorTexto = contador === 1 ? '1 archivo adjunto' : `${contador} archivos adjuntos`;
                
                // Actualizar o crear contador
                let contadorDiv = document.getElementById('contador-archivos');
                if (!contadorDiv) {
                    contadorDiv = document.createElement('div');
                    contadorDiv.id = 'contador-archivos';
                    contadorDiv.style.cssText = 'font-size: 11px; color: #129be5; font-weight: 600; margin-top: 4px;';
                    lista.parentNode.appendChild(contadorDiv);
                }
                contadorDiv.textContent = contadorTexto;
            }
            
            function verArchivo(index) {
                if (archivosAdjuntos[index]) {
                    const archivo = archivosAdjuntos[index];
                    const ventana = window.open('', '_blank');
                    if (archivo.tipo === 'pdf') {
                        ventana.document.write(`<iframe src="${archivo.data}" width="100%" height="100%" style="border: none;"></iframe>`);
                    } else {
                        ventana.document.write(`<img src="${archivo.data}" style="max-width: 100%; height: auto;" alt="${archivo.nombre}">`);
                    }
                }
            }
            
            function eliminarArchivo(index) {
                if (confirm('¿Eliminar este archivo adjunto?')) {
                    archivosAdjuntos.splice(index, 1);
                    actualizarListaArchivos();
                    guardarArchivosReclamo();
                }
            }
            
            function limpiarArchivos() {
                if (archivosAdjuntos.length === 0) {
                    alert('No hay archivos para limpiar');
                    return;
                }
                
                if (confirm('¿Eliminar todos los archivos adjuntos?')) {
                    archivosAdjuntos = [];
                    actualizarListaArchivos();
                    guardarArchivosReclamo();
                }
            }
            
            function guardarArchivosReclamo() {
                const userId = localStorage.getItem('userId') || sessionStorage.getItem('userId') || 'default';
                localStorage.setItem(`reclamo_archivos_${userId}`, JSON.stringify(archivosAdjuntos));
            }
            
            function cargarArchivosReclamo() {
                const userId = localStorage.getItem('userId') || sessionStorage.getItem('userId') || 'default';
                const archivosGuardados = localStorage.getItem(`reclamo_archivos_${userId}`);
                
                if (archivosGuardados) {
                    try {
                        archivosAdjuntos = JSON.parse(archivosGuardados);
                        actualizarListaArchivos();
                    } catch (error) {
                        console.error('Error al cargar archivos del reclamo:', error);
                        archivosAdjuntos = [];
                    }
                }
            }
            
            // Cargar archivos al iniciar la página
            window.addEventListener('load', function() {
                cargarArchivosReclamo();
            });

            function toggleRecording() {
                const micContainer = document.getElementById('mic-container');
                const recordingText = document.getElementById('recording-text');

                if (!window.plugins || !window.plugins.speechRecognition) {
                    alert("Speech Recognition plugin not available.");
                    return;
                }

                if (!isRecording) {
                    window.plugins.speechRecognition.hasPermission(function (hasPermission) {
                        if (!hasPermission) {
                            window.plugins.speechRecognition.requestPermission(function () {
                                startListening();
                            }, function (err) {
                                alert("Permission denied: " + err);
                            });
                        } else {
                            startListening();
                        }
                    }, function (err) {
                        alert("Error checking permission: " + err);
                    });

                    function startListening() {
                        window.plugins.speechRecognition.startListening(function (matches) {
                            if (matches && matches.length > 0) {
                                document.getElementById("reclamo2").value = matches[0];
                            }
                        }, function (err) {
                            console.error("Speech recognition error: ", err);
                        }, {
                            language: "es-ES",
                            showPopup: false,
                            showPartial: true
                        });

                        micContainer.classList.add('recording');
                        recordingText.style.display = 'block';
                        isRecording = true;
                    }
                } else {
                    window.plugins.speechRecognition.stopListening(function () {
                        micContainer.classList.remove('recording');
                        recordingText.style.display = 'none';
                        isRecording = false;

                        // Append recognized text to reclamo textarea
                        var reclamo = document.getElementById("reclamo");
                        var reclamo2 = document.getElementById("reclamo2");
                        if (reclamo.value != "") {
                            reclamo.value = reclamo.value + ".\n" + reclamo2.value;
                        } else {
                            reclamo.value = reclamo2.value;
                        }
                        reclamo2.value = "";
                    }, function (err) {
                        console.error("Error stopping speech recognition: ", err);
                    });
                }
            }

            async function envia_reclamo() {
                try {
                    const tipo = document.getElementById('reclamo-type').value;
                    const reclamo = document.getElementById('reclamo').value;
                    
                    if (tipo == "") {
                        alert("Debe seleccionar tipo de reclamo");
                        document.getElementById('reclamo-type').focus();
                        return;
                    }   
                    if (reclamo == "") {
                        alert("Debe ingresar reclamo");
                        document.getElementById('reclamo').focus();
                        return;
                    }
                    
                    // Preparar información de archivos adjuntos para envío
                    let reclamoCompleto = reclamo;
                    if (archivosAdjuntos.length > 0) {
                        reclamoCompleto += "\n\n--- ARCHIVOS ADJUNTOS ---\n";
                        archivosAdjuntos.forEach((archivo, index) => {
                            const tipoTexto = archivo.tipo === 'pdf' ? 'PDF' : 'Imagen';
                            const sizeKB = Math.round(archivo.size / 1024);
                            reclamoCompleto += `${index + 1}. ${archivo.nombre} (${tipoTexto}, ${sizeKB}KB)\n`;
                        });
                        
                        // Guardar archivos específicos de este reclamo
                        const fechaReclamo = new Date().toISOString();
                        const userId = localStorage.getItem('userId') || sessionStorage.getItem('userId') || 'default';
                        localStorage.setItem(`reclamo_archivos_enviado_${fechaReclamo}_${userId}`, JSON.stringify(archivosAdjuntos));
                    }
                    
                    res = await post_reclamo(reclamoCompleto, tipo);
                    if (res.length == 0) {
                        abre_pag("error_uuid.html");
                    } else {
                        // Guardar reclamo en historial del usuario
                        guardarReclamoEnHistorial(tipo, reclamo, archivosAdjuntos);
                        
                        // Limpiar archivos adjuntos después del envío exitoso
                        archivosAdjuntos = [];
                        actualizarListaArchivos();
                        guardarArchivosReclamo();
                        
                        // Show confirmation div
                        const confirmationDiv = document.getElementById('reclamo-confirmation');
                        confirmationDiv.style.display = 'block';
                        // Keep confirmation div visible permanently (no hide)
                        // setTimeout(() => {
                        //     confirmationDiv.style.display = 'none';
                        // }, 4000);
                        // After 3 seconds, animate moveUpAndFade and then hide
                        setTimeout(() => {
                            confirmationDiv.style.animation = 'moveUpAndFade 2s forwards';
                            setTimeout(() => {
                                confirmationDiv.style.display = 'none';
                                // Limpiar formulario después de animación
                                document.getElementById('reclamo').value = '';
                                document.getElementById('reclamo-type').selectedIndex = 0;
                            }, 2000);
                        }, 3000);
                    }
                } catch (e) {
                    alert("ERROR: " + e)
                }
            }

            function cancelar() {
                try {
                    // Limpiar archivos adjuntos al cancelar
                    if (archivosAdjuntos.length > 0) {
                        if (confirm('¿Cancelar reclamo? Se perderán los archivos adjuntos.')) {
                            archivosAdjuntos = [];
                            guardarArchivosReclamo();
                            abre_pag("home.html");
                        }
                    } else {
                        abre_pag("home.html");
                    }
                } catch (e) {
                    alert("ERROR: " + e)
                }
            }

            async function buscar_tipo_reclamo() {
                try {
                    const select = document.getElementById('reclamo-type');
                    if (!select) {
                        console.error('Select element not found');
                        return;
                    }
                    
                    select.innerHTML = '';
                    
                    // Agregar opción por defecto
                    const defaultOption = document.createElement('option');
                    defaultOption.value = '';
                    defaultOption.textContent = 'Seleccione un tipo de reclamo';
                    defaultOption.disabled = true;
                    defaultOption.selected = true;
                    select.appendChild(defaultOption);
                    
                    // Siempre cargar opciones de fallback primero
                    const fallbackOptions = [
                        { id: '1', nombre: 'RECLAMO' },
                        { id: '2', nombre: 'COMENTARIO/FELICITACION' },
                        { id: '3', nombre: 'SUGERENCIA' },
                        { id: '4', nombre: 'CONSULTA' }
                    ];
                    
                    fallbackOptions.forEach(tipo => {
                        const option = document.createElement('option');
                        option.value = tipo.id;
                        option.textContent = tipo.nombre;
                        select.appendChild(option);
                    });
                    
                    console.log('Fallback options loaded, total options:', select.options.length);
                    
                    // Intentar obtener opciones del servidor
                    try {
                        const res = await get_tipo_reclamo();
                        if (res && res.length > 0) {
                            // Limpiar y volver a cargar con datos del servidor
                            select.innerHTML = '';
                            
                            // Re-agregar opción por defecto
                            const serverDefaultOption = document.createElement('option');
                            serverDefaultOption.value = '';
                            serverDefaultOption.textContent = 'Seleccione un tipo de reclamo';
                            serverDefaultOption.disabled = true;
                            serverDefaultOption.selected = true;
                            select.appendChild(serverDefaultOption);
                            
                            res.forEach(tipo => {
                                const option = document.createElement('option');
                                option.value = tipo.id;
                                option.textContent = tipo.nombre;
                                select.appendChild(option);
                            });
                            console.log("Opciones del servidor cargadas: " + JSON.stringify(res));
                        }
                    } catch (serverError) {
                        console.log("Error al obtener tipos del servidor, usando fallback:", serverError);
                    }
                    
                    // Agregar evento de cambio para debugging
                    select.addEventListener('change', function() {
                        console.log('Select changed to:', this.value, this.options[this.selectedIndex].text);
                    });
                    
                    // Forzar re-render del select
                    select.style.display = 'none';
                    select.offsetHeight; // Trigger reflow
                    select.style.display = 'block';
                    
                } catch (e) {
                    console.log("ERROR en buscar_tipo_reclamo: " + e);
                    // Último recurso: cargar opciones básicas
                    const select = document.getElementById('reclamo-type');
                    if (select && select.options.length <= 1) {
                        select.innerHTML = '';
                        const options = [
                            { value: '', text: 'Seleccione un tipo de reclamo', disabled: true, selected: true },
                            { value: '1', text: 'RECLAMO' },
                            { value: '2', text: 'COMENTARIO/FELICITACION' }
                        ];
                        
                        options.forEach(opt => {
                            const option = document.createElement('option');
                            option.value = opt.value;
                            option.textContent = opt.text;
                            if (opt.disabled) option.disabled = true;
                            if (opt.selected) option.selected = true;
                            select.appendChild(option);
                        });
                        console.log('Opciones de emergencia cargadas');
                    }
                }
            }

            // New code to dynamically set reclamo-container height
            function adjustReclamoContainerHeight() {
                const container = document.querySelector('.reclamo-container');
                if (container) {
                    const offsetTop = container.getBoundingClientRect().top;
                    const viewportHeight = window.innerHeight;
                    const newHeight = viewportHeight - offsetTop - 10; // Reducido el padding bottom
                    container.style.height = newHeight + 'px';
                    container.style.overflowY = 'auto'; // Permitir scroll si es necesario
                }
            }

            // Función para reajustar cuando cambian los elementos visibles
            function reajustarAltura() {
                setTimeout(() => {
                    adjustReclamoContainerHeight();
                }, 100); // Pequeño delay para que las animaciones terminen
            }

            window.addEventListener('load', adjustReclamoContainerHeight);
            window.addEventListener('resize', adjustReclamoContainerHeight);
            
            // Función para guardar reclamo en historial del usuario
            function guardarReclamoEnHistorial(tipoId, descripcion, archivos) {
                const userId = localStorage.getItem('userId') || sessionStorage.getItem('userId') || 'default';
                const fecha = new Date().toISOString();
                
                // Obtener el nombre del tipo de reclamo del select
                const selectElement = document.getElementById('reclamo-type');
                const tipoNombre = selectElement.options[selectElement.selectedIndex]?.text || tipoId;
                
                const nuevoReclamo = {
                    id: Date.now(), // ID único basado en timestamp
                    tipo: tipoNombre, // Guardar el nombre del tipo en lugar del ID
                    tipoId: tipoId, // Mantener el ID por si se necesita
                    descripcion: descripcion,
                    fecha: fecha,
                    estado: 'En proceso', // Estado inicial
                    archivos: archivos.map(archivo => ({
                        nombre: archivo.nombre,
                        tipo: archivo.tipo,
                        size: archivo.size
                    }))
                };
                
                // Obtener reclamos existentes del usuario
                let reclamosUsuario = [];
                const reclamosGuardados = localStorage.getItem(`user_reclamos_${userId}`);
                
                if (reclamosGuardados) {
                    try {
                        reclamosUsuario = JSON.parse(reclamosGuardados);
                    } catch (error) {
                        console.error('Error al cargar reclamos existentes:', error);
                        reclamosUsuario = [];
                    }
                }
                
                // Agregar nuevo reclamo al inicio de la lista
                reclamosUsuario.unshift(nuevoReclamo);
                
                // Limitar a los últimos 50 reclamos para no sobrecargar localStorage
                if (reclamosUsuario.length > 50) {
                    reclamosUsuario = reclamosUsuario.slice(0, 50);
                }
                
                // Guardar lista actualizada
                localStorage.setItem(`user_reclamos_${userId}`, JSON.stringify(reclamosUsuario));
                
                console.log('Reclamo guardado en historial:', nuevoReclamo);
            }
            
            // Asegurar que la función se ejecute cuando el DOM esté listo
            document.addEventListener('DOMContentLoaded', function() {
                console.log('DOM loaded, executing buscar_tipo_reclamo');
                buscar_tipo_reclamo();
            });
            
            // También ejecutar después de un breve delay para casos edge
            setTimeout(function() {
                const select = document.getElementById('reclamo-type');
                if (select && select.options.length <= 1) {
                    console.log('Secondary execution of buscar_tipo_reclamo');
                    buscar_tipo_reclamo();
                }
            }, 1000);
        </script>
