<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar usuario</title>
    <link rel="stylesheet" href="css/index.css">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
        .msg { background: rgba(255,255,255,0.9); padding: 20px 24px; border-radius: 12px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:#222; max-width: 680px; text-align:center; box-shadow: 0 6px 24px rgba(0,0,0,0.12); }
        .msg b { color:#129be5; }
        .home-icon { position: fixed; bottom: 24px; right: 24px; text-decoration:none; }
    </style>
    <link rel="stylesheet" href="css/recuperar.css">
    
</head>
<body>
    <div class="msg">para recuperar su usuario contactenos a: <b id="email-text">innova@innovarecoleta.cl</b>
        <div style="margin-top:12px;"><button id="contact-btn" style="padding:8px 12px;border-radius:8px;border:0;background:#129be5;color:#fff;cursor:pointer">IR A GMAIL</button></div>
    </div>
    <a href="index.html" class="home-icon" aria-label="Ir al inicio">
        <img src="img/home-icon.svg" alt="Inicio" class="home-icon-img">
    </a>
    <div id="toast" style="position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:rgba(0,0,0,0.8);color:#fff;padding:8px 12px;border-radius:8px;display:none;font-size:14px;">
    </div>
    <script>
        (function(){
            const email = 'innova@innovarecoleta.cl';
            const btn = document.getElementById('contact-btn');
            const toast = document.getElementById('toast');
            const emailText = document.getElementById('email-text');
            if(emailText) emailText.textContent = email;

            function showToast(msg){
                toast.textContent = msg;
                toast.style.display = 'block';
                clearTimeout(window._toastTimer);
                window._toastTimer = setTimeout(()=>{ toast.style.display = 'none'; }, 2000);
            }

            async function copyToClipboard(text){
                try{
                    if(navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(text);
                        return true;
                    }
                }catch(e){}
                // fallback
                try{
                    const ta = document.createElement('textarea');
                    ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta);
                    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
                    return true;
                }catch(e){ return false; }
            }

            function openMailFallback(){
                window.location.href = 'mailto:' + email + '?subject=Recuperar%20usuario';
            }

            function openGmailAndroid(){
                // Intent URL - will open Gmail app on Android if available
                const intentUrl = 'intent:mailto:' + email + '#Intent;package=com.google.android.gm;action=android.intent.action.SENDTO;end';
                window.location.href = intentUrl;
            }

            function openGmailIOS(){
                // Gmail URL scheme for iOS (may not be installed)
                const gmail = 'googlegmail://co?to=' + encodeURIComponent(email);
                // try to open gmail scheme then fallback to mailto
                const start = Date.now();
                window.location = gmail;
                setTimeout(function(){
                    // if not switched after ~1s, fallback
                    if(Date.now() - start < 1200) openMailFallback();
                }, 900);
            }

            btn.addEventListener('click', async function(){
                await copyToClipboard(email);
                showToast('Correo copiado al portapapeles');

                const ua = navigator.userAgent || '';
                if(/Android/i.test(ua)){
                    try{ openGmailAndroid(); }catch(e){ openMailFallback(); }
                } else if(/iPhone|iPad|iPod/i.test(ua)){
                    try{ openGmailIOS(); }catch(e){ openMailFallback(); }
                } else {
                    // Desktop: open mail client
                    openMailFallback();
                }
            });
        })();
    </script>
</body>
</html>
