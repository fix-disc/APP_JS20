<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avisos</title>
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/avisos.css" />
</head>
<body>
    <div class="home-icon-wrap">
        <a href="home.html" class="home-icon" aria-label="Ir al inicio">
            <img src="img/home-icon.svg" alt="Inicio" class="home-icon-img" style="height:56px;">
        </a>
        <span class="home-label">IR A INICIO</span>
    </div>
        <div class="avisos-container">
            <!-- Small header logos -->
            <div class="header-logos small">
                <img src="img/logo-innova-blanco.png" alt="Logo Innova Blanco" class="header-logo" />
                <img src="img/logo-muni-blanco.png" alt="Logo Municipalidad" class="header-logo" />
            </div>

            <!-- Title -->
            <h2 class="avisos-title">AVISOS COMUNIDAD</h2>

            <!-- Avisos list (flexible, will scroll internally if needed) -->
            <div class="avisos-box" id="avisos-lista">
            <div id="loading" style="color:#b1b1b1; text-align:center;">
                <p>Cargando avisos...</p>
            </div>
            <div id="avisos-content" style="display:none; margin-right: 10%; margin-left: -10px;">
            </div>
            <div id="no-avisos" style="color:#888; text-align:center; display:none;">
                <p>No hay avisos disponibles en este momento.</p>
            </div>
        </div>
    </div>
    <!-- Modal para vista ampliada de aviso -->
    <div id="aviso-modal" class="aviso-modal" style="display:none;">
        <div class="aviso-modal-backdrop" onclick="closeAvisoModal()"></div>
        <div class="aviso-modal-content">
            <button class="aviso-modal-close" onclick="closeAvisoModal()">&times;</button>
            <div id="aviso-modal-imagen" class="aviso-modal-imagen"></div>
            <div id="aviso-modal-text" class="aviso-modal-text"></div>
            <div id="aviso-modal-fecha" class="aviso-modal-fecha"></div>
            <div id="aviso-modal-estado" class="aviso-modal-estado-container"></div>
        </div>
    </div>
    
    
    <script src="js/api.js"></script>
    <script>
        async function cargarAvisos() {
            try {
                const avisos = await get_avisos();
                console.log('Avisos cargados:', avisos);
                mostrarAvisos(avisos);
            } catch (error) {
                console.error('Error al cargar avisos:', error);
                mostrarError();
            }
        }
        
        function mostrarAvisos(avisos) {
            const loadingDiv = document.getElementById('loading');
            const contentDiv = document.getElementById('avisos-content');
            const noAvisosDiv = document.getElementById('no-avisos');
            
            loadingDiv.style.display = 'none';
            
            if (avisos && avisos.length > 0) {
                    // Mostrar los avisos del más reciente al más antiguo
                    let html = '';
                    const sorted = avisos.slice().sort((a,b) => new Date(b.fechahora) - new Date(a.fechahora));
                    sorted.forEach(aviso => {
                        const fecha = new Date(aviso.fechahora);
                        const fechaFormateada = formatearFecha(fecha);
                        const safeText = (aviso.texto || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');

                        // Imagen: si viene con URL completa, usarla; si viene como nombre, buscar en carpeta img/
                        let imagenHtml = '';
                        let imgSrc = '';
                        if (aviso.imagen) {
                            imgSrc = /^(https?:)?\/\//.test(aviso.imagen) || aviso.imagen.startsWith('data:')
                                ? aviso.imagen
                                : 'img/' + aviso.imagen;
                            imagenHtml = `<div class="aviso-imagen"><img src="${imgSrc}" alt="Imagen aviso"/></div>`;
                        }

                        // encode imgSrc and estado into data-attributes to avoid quote issues
                        const encodedImg = encodeURIComponent(imgSrc || '');
                        const encodedEstado = encodeURIComponent(aviso.estado || '');
                        html += `
                            <div class="aviso-item" role="button" tabindex="0" data-img="${encodedImg}" data-estado="${encodedEstado}" onclick="openAvisoModal(this)" onkeypress="if(event.key==='Enter') openAvisoModal(this)">
                                <div class="aviso-fecha">${fechaFormateada}</div>
                                ${imagenHtml}
                                <div class="aviso-descripcion bordered">${safeText}</div>
                            </div>
                        `;
                    });
                
                contentDiv.innerHTML = html;
                contentDiv.style.display = 'block';
                noAvisosDiv.style.display = 'none';
                // Auto-scroll al inicio (como los más recientes están primero)
                const box = document.getElementById('avisos-lista');
                if (box) { box.scrollTop = 0; }
            } else {
                contentDiv.style.display = 'none';
                noAvisosDiv.style.display = 'block';
            }
        }
        
        function formatearFecha(fecha) {
            const opciones = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            return fecha.toLocaleDateString('es-ES', opciones);
        }
        
        function mostrarError() {
            const loadingDiv = document.getElementById('loading');
            const contentDiv = document.getElementById('avisos-content');
            const noAvisosDiv = document.getElementById('no-avisos');
            
            loadingDiv.style.display = 'none';
            contentDiv.style.display = 'none';
            
            noAvisosDiv.innerHTML = '<p>Error al cargar los avisos. Intente nuevamente más tarde.</p>';
            noAvisosDiv.style.display = 'block';
        }
        
        // Cargar avisos al cargar la página
        document.addEventListener('DOMContentLoaded', cargarAvisos);
        
        // Actualizar avisos cada 30 segundos
        setInterval(cargarAvisos, 30000);

        // Abrir modal con aviso (recibe el elemento .aviso-item)
        function openAvisoModal(el) {
            const modal = document.getElementById('aviso-modal');
            const textoEl = document.getElementById('aviso-modal-text');
            const fechaEl = document.getElementById('aviso-modal-fecha');
            const imagenEl = document.getElementById('aviso-modal-imagen');
            const estadoEl = document.getElementById('aviso-modal-estado');

            // Texto y fecha desde los elementos hijos
            const textoHtml = el.querySelector('.aviso-descripcion') ? el.querySelector('.aviso-descripcion').innerHTML : '';
            const fechaText = el.querySelector('.aviso-fecha') ? el.querySelector('.aviso-fecha').textContent : '';

            textoEl.innerHTML = textoHtml.replace(/\n/g, '<br>');
            fechaEl.textContent = fechaText;

            // Imagen (data-img está codificado con encodeURIComponent)
            const encodedImg = el.getAttribute('data-img') || '';
            const imgSrc = encodedImg ? decodeURIComponent(encodedImg) : '';
            if (imgSrc) {
                imagenEl.innerHTML = `<img src="${imgSrc}" alt="Imagen aviso" style="max-width:100%;border-radius:8px;margin-bottom:12px">`;
            } else {
                imagenEl.innerHTML = '';
            }

            // Estado
            const encodedEstado = el.getAttribute('data-estado') || '';
            const estado = encodedEstado ? decodeURIComponent(encodedEstado) : '';
            if (estado) {
                estadoEl.innerHTML = `<div class="aviso-modal-estado">${estado}</div>`;
            } else {
                estadoEl.innerHTML = '';
            }

            modal.style.display = 'block';
            // Activar animación de aparición
            requestAnimationFrame(() => modal.classList.add('show'));
            // Evitar que el scroll del fondo interfiera
            document.body.style.overflow = 'hidden';
        }

        function closeAvisoModal() {
            const modal = document.getElementById('aviso-modal');
            // Quitar clase para animar ocultar
            modal.classList.remove('show');
            const onEnd = (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                    modal.removeEventListener('transitionend', onEnd);
                }
            };
            modal.addEventListener('transitionend', onEnd);
            document.body.style.overflow = '';
        }

        // Escapar comillas simples/dobles para inyección en onclick strings
        function escapeQuotes(str) {
            return String(str).replace(/'/g, "\\'").replace(/\"/g, '\\\"');
        }
    </script>
</body>
</html>
