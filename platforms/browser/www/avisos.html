<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noticias y Avisos</title>
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/avisos.css" />
</head>
<body>
    <a href="home.html" class="home-icon" aria-label="Ir al inicio" style="position: absolute; top: 24px; left: 24px; z-index: 10;">
        <span style="display: inline-block; position: relative; width: 56px; height: 56px;">
            <svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" style="position: absolute; top: 0; left: 0;"><circle cx="28" cy="28" r="28" fill="white"/></svg>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#129be5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; top: 14px; left: 14px;"><path d="M3 12L12 3l9 9"/><path d="M9 21V9h6v12"/></svg>
        </span>
    </a>
    <div class="avisos-container">
        <h2>Avisos</h2>
        <div class="avisos-box" id="avisos-lista">
            <div id="loading" style="color:#888; text-align:center;">
                <p>Cargando avisos...</p>
            </div>
            <div id="avisos-content" style="display:none;">
                <!-- Los avisos se cargarán aquí dinámicamente -->
            </div>
            <div id="no-avisos" style="color:#888; text-align:center; display:none;">
                <p>No hay avisos disponibles en este momento.</p>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script>
        async function cargarAvisos() {
            try {
                const avisos = await get_avisos();
                mostrarAvisos(avisos);
            } catch (error) {
                console.error('Error al cargar avisos:', error);
                mostrarError();
            }
        }
        
        function mostrarAvisos(avisos) {
            const loadingDiv = document.getElementById('loading');
            const contentDiv = document.getElementById('avisos-content');
            const noAvisosDiv = document.getElementById('no-avisos');
            
            loadingDiv.style.display = 'none';
            
            if (avisos && avisos.length > 0) {
                let html = '';
                avisos.forEach(aviso => {
                    const fecha = new Date(aviso.fecha_hora || aviso.fecha);
                    const fechaFormateada = formatearFecha(fecha);
                    
                    html += `
                        <div class="aviso-item">
                            <div class="aviso-descripcion">${aviso.descripcion || aviso.mensaje || aviso.titulo}</div>
                            <div class="aviso-fecha">${fechaFormateada}</div>
                        </div>
                    `;
                });
                
                contentDiv.innerHTML = html;
                contentDiv.style.display = 'block';
                noAvisosDiv.style.display = 'none';
            } else {
                contentDiv.style.display = 'none';
                noAvisosDiv.style.display = 'block';
            }
        }
        
        function formatearFecha(fecha) {
            const opciones = {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            return fecha.toLocaleDateString('es-ES', opciones);
        }
        
        function mostrarError() {
            const loadingDiv = document.getElementById('loading');
            const contentDiv = document.getElementById('avisos-content');
            const noAvisosDiv = document.getElementById('no-avisos');
            
            loadingDiv.style.display = 'none';
            contentDiv.style.display = 'none';
            
            noAvisosDiv.innerHTML = '<p>Error al cargar los avisos. Intente nuevamente más tarde.</p>';
            noAvisosDiv.style.display = 'block';
        }
        
        // Cargar avisos al cargar la página
        document.addEventListener('DOMContentLoaded', cargarAvisos);
        
        // Actualizar avisos cada 30 segundos
        setInterval(cargarAvisos, 30000);
    </script>
</body>
</html>
