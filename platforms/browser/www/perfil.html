<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/perfil.css" />
    <style>
        /* notifications: small non-blocking boxes */
        .profile-notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 14px;
            border-radius: 8px;
            color: #fff;
            z-index: 2500;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(0,0,0,0.18);
            max-width: 92%;
            display: inline-block;
            text-align: center;
            box-sizing: border-box;
        }
        .notification-info { background:#2196F3 }
        .notification-success { background:#16a34a }
        .notification-error { background:#dc2626 }
        .notification-exit { opacity:0; transition: opacity 0.3s }

        /* PDF modal (tarjeta) */
        .pdf-modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); z-index: 2200; }
        .pdf-modal[aria-hidden="false"] { display: flex; }
        .pdf-card { background: #fff; border-radius: 10px; width: 92%; max-width: 980px; height: 82vh; display:flex; flex-direction:column; overflow:hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.35); }
        .pdf-card-header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid #eee; }
        .pdf-card-header h3 { margin:0; font-size:16px; color:#0f172a; }
        .pdf-close { margin-left:auto; background:transparent; border:0; font-size:24px; line-height:1; cursor:pointer; padding:6px; }
        .pdf-body { flex:1; background:#f6f6f7; display:flex; }
        .pdf-body iframe, .pdf-body object { width:100%; height:100%; border:0; }
        .pdf-card-footer { padding:10px 14px; border-top:1px solid #eee; display:flex; gap:8px; justify-content:flex-end; }
        .pdf-action-btn { background:#1e40af; color:#fff; border:0; padding:8px 12px; border-radius:8px; cursor:pointer }
        @media (max-width:480px){ .pdf-card{ height:88vh; } .pdf-card-header h3{ font-size:14px } }
    </style>
</head>

        </div>
        <h2>Mi Perfil</h2>

        <div style="display:flex; justify-content:center; align-items:center; width:100%; margin-bottom:12px;">
            <button class="perfil-foto-btn" onclick="document.getElementById('fotoInput').click()">CAMBIAR FOTO</button>
        </div>

            <strong>RUT:</strong> <span id="rutUsuario">Cargando...</span><br>
        </div>

        <div class="docs-section">
            <div class="docs-title">DOCUMENTOS</div>
            <div class="docs-list">
                <div class="doc-item reglamento-item">

                    <div class="doc-actions">
                        <button id="verPdfBtn" type="button" class="doc-link reglamento-btn">Ver PDF</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- PDF modal (tarjeta) -->
        <div id="pdfModal" class="pdf-modal" aria-hidden="true" role="dialog" aria-label="Visor de PDF">
            <div class="pdf-card" role="document">

                    <h3 id="pdfTitle">Reglamento de Convivencia</h3>
                    <button id="pdfCloseBtn" class="pdf-close" onclick="cerrarReglamento()" aria-label="Cerrar tarjeta">&times;</button>

                <div class="pdf-body">
                    <iframe id="pdfIframe" title="Visor PDF" src="" frameborder="0" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>
                </div>
                <div class="pdf-card-footer">
                    <button class="pdf-action-btn" id="pdfDownloadBtn">Descargar</button>
                    <button class="pdf-action-btn" id="pdfCloseFooterBtn">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="home-icon-wrap">
        <a href="home.html" class="home-icon" aria-label="Ir al inicio">

    <script>
        // page init
        window.addEventListener('load', function(){ cargarDatosUsuario(); cargarFotoPerfil(); });

        async function cargarDatosUsuario(){
            try{
                const userEmail = localStorage.getItem('userEmail');
                const userName = localStorage.getItem('userName');
                const userRut = localStorage.getItem('userRut');

                if (userEmail || userName) {
                    document.getElementById('nombreUsuario').textContent = userName || 'No disponible';
                    document.getElementById('emailUsuario').textContent = userEmail || 'No disponible';
                    document.getElementById('rutUsuario').textContent = userRut || 'No disponible';
                    return;
                }

                const userId = localStorage.getItem('userId') || sessionStorage.getItem('userId');
                if (!userId) { mostrarDatosNoDisponibles(); return; }

                const userData = await get_users(userId);
                const usuario = Array.isArray(userData) ? (userData[0] || null) : (userData || null);
                if (usuario && Object.keys(usuario).length>0) {
                    document.getElementById('nombreUsuario').textContent = usuario.nombre || 'No disponible';
                    document.getElementById('emailUsuario').textContent = usuario.email || 'No disponible';
                    document.getElementById('rutUsuario').textContent = usuario.rut || 'No disponible';
                } else {
                    mostrarDatosNoDisponibles();
                }
            } catch(e){ console.error('Error al cargar datos del usuario:', e); mostrarDatosNoDisponibles(); }
        }

        function mostrarDatosNoDisponibles(){
            document.getElementById('nombreUsuario').textContent = 'No disponible';
            document.getElementById('emailUsuario').textContent = 'No disponible';
            document.getElementById('rutUsuario').textContent = 'No disponible';
        }

        function cargarFotoPerfil(){
            const userId = localStorage.getItem('userId') || sessionStorage.getItem('userId') || 'default';
            const fotoGuardada = localStorage.getItem(`perfil_foto_${userId}`);
            if (fotoGuardada) document.getElementById('perfilFoto').src = fotoGuardada;
        }

        function guardarFotoPerfil(fotoDataURL){
            const userId = localStorage.getItem('userId') || sessionStorage.getItem('userId') || 'default';
            localStorage.setItem(`perfil_foto_${userId}`, fotoDataURL);
            mostrarNotificacion('Foto de perfil guardada correctamente','success');
        }

        document.getElementById('fotoInput').addEventListener('change', function(e){
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { mostrarNotificacion('Por favor, selecciona un archivo de imagen válido','error'); return; }
            if (file.size > 5*1024*1024) { mostrarNotificacion('La imagen es muy grande. Máximo 5MB permitido','error'); return; }
            const reader = new FileReader();
            reader.onload = function(ev){ document.getElementById('perfilFoto').src = ev.target.result; guardarFotoPerfil(ev.target.result); };
            reader.readAsDataURL(file);
        });

        // bind button after DOM ready
        document.addEventListener('DOMContentLoaded', function(){
            const btn = document.getElementById('verPdfBtn');
            if (btn) btn.addEventListener('click', abrirReglamento);
        });

        // modal close
        function cerrarReglamento(){
            const modal = document.getElementById('pdfModal');
            const iframe = document.getElementById('pdfIframe');
            try{ iframe.src = ''; }catch(e){}
            modal.setAttribute('aria-hidden','true');
            document.documentElement.style.overflow = '';
            document.body.style.overflow = '';
        }

        // footer/close button behavior for modal
        document.addEventListener('DOMContentLoaded', function(){
            const closeBtn = document.getElementById('pdfCloseBtn');
            const closeFooter = document.getElementById('pdfCloseFooterBtn');
            const downloadBtn = document.getElementById('pdfDownloadBtn');
            if (closeBtn) closeBtn.addEventListener('click', cerrarReglamento);
            if (closeFooter) closeFooter.addEventListener('click', cerrarReglamento);
            if (downloadBtn) downloadBtn.addEventListener('click', function(){
                // If running inside Cordova and fileOpener2 is available, use native flow
                if (window.cordova && cordova.plugins && cordova.plugins.fileOpener2) {
                    abrirReglamentoNativo();
                    return;
                }
                const pdf = document.getElementById('pdfIframe').src || 'docs/Reglamento de Convivencia_JS1.pdf';
                const a = document.createElement('a'); a.href = pdf; a.download = ''; a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove();
            });
            // close on ESC
            document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ const modal = document.getElementById('pdfModal'); if(modal && modal.getAttribute('aria-hidden') === 'false'){ cerrarReglamento(); } } });
        });

        function mostrarNotificacion(mensaje,tipo='info'){
            const existing = document.querySelector('.profile-notification'); if (existing) existing.remove();
            const n = document.createElement('div'); n.className = `profile-notification notification-${tipo}`; n.textContent = mensaje; document.body.appendChild(n);
            setTimeout(()=>{ n.classList.add('notification-exit'); setTimeout(()=>n.remove(),300); }, 3000);
        }
