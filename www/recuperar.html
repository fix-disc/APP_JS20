<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="css/index.css">    
    <link rel="stylesheet" href="css/recuperar.css">
</head>
<body>
    <div class="body_vid"></div>
    
    <div class="recuperar-container" style="z-index: 10; position: relative;">
        <h2>Recuperar contraseña</h2>
        <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
        <input type="email" id="email-input" placeholder="Correo electrónico" required>
        <button class="recuperar-btn" onclick="enviarRecuperacion()">Enviar enlace</button>
        
        <!-- Mensaje de confirmación -->
        <div id="confirmation-message" class="confirmation-message" style="display: none;">
            <div class="confirmation-content">
                <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 12l2 2 4-4"></path>
                    <circle cx="12" cy="12" r="10"></circle>
                </svg>
                <h3>¡Enlace enviado!</h3>
                <p id="confirmation-text">Se ha enviado un enlace de recuperación a tu correo electrónico.</p>
                <button class="confirmation-btn" onclick="cerrarConfirmacion()">Entendido</button>
            </div>
        </div>
    </div>
    
    <a href="index.html" class="home-icon" aria-label="Ir al inicio">
        <svg height="100" width="100" xmlns="http://www.w3.org/2000/svg"><circle r="25" cx="50" cy="50" fill="white" /></svg>
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#129be5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" style="transform: translateX(-69px);"><path d="M3 12L12 3l9 9"/><path d="M9 21V9h6v12"/></svg>
    </a>

    <script>
        function enviarRecuperacion() {
            const emailInput = document.getElementById('email-input');
            const email = emailInput.value.trim();
            
            // Validar que el email no esté vacío
            if (!email) {
                alert('Por favor, ingresa tu correo electrónico.');
                emailInput.focus();
                return;
            }
            
            // Validar formato de email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Por favor, ingresa un correo electrónico válido.');
                emailInput.focus();
                return;
            }
            
            // Mostrar mensaje de confirmación personalizado
            const confirmationText = document.getElementById('confirmation-text');
            confirmationText.innerHTML = `Se ha enviado un enlace de recuperación a:<br><strong>${email}</strong><br><br>Revisa tu bandeja de entrada y tu carpeta de spam.`;
            
            // Mostrar el modal de confirmación
            document.getElementById('confirmation-message').style.display = 'flex';
            
            // Limpiar el campo de email
            emailInput.value = '';
            
            // Aquí se haría la llamada real al servidor para enviar el email
            // Por ahora solo simulamos el envío
            console.log(`Enviando enlace de recuperación a: ${email}`);
        }
        
        function cerrarConfirmacion() {
            document.getElementById('confirmation-message').style.display = 'none';
        }
        
        // Permitir enviar con Enter
        document.getElementById('email-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                enviarRecuperacion();
            }
        });
        
        // Cerrar modal al hacer click fuera de él
        document.getElementById('confirmation-message').addEventListener('click', function(e) {
            if (e.target === this) {
                cerrarConfirmacion();
            }
        });
    </script>
</body>
</html>
