<!DOCTYPE html>
<html>
    <head>
        <meta    </head>
    <body onload="buscar_tipo_reclamo()">
        <div class="reclamo-container" style="z-index: 1;">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Justicia-Sociapp</title>
        <link rel="icon" type="image/png" href="img/JS sin fondo.png">
        <link rel="stylesheet" href="css/index.css">
        <link rel="stylesheet" href="css/reclamo.css">
        <style>
            /* Mejorar la apariencia del input file */
            #reclamo-input {
                transition: border-color 0.2s ease;
            }
            
            #reclamo-input:focus {
                outline: none;
                border-color: #129be5;
                box-shadow: 0 0 0 2px rgba(18, 155, 229, 0.2);
            }
        </style>
    </head>
    <body onload="buscar_tipo_reclamo()">
        <div class="reclamo-container" style="z-index: 1;">
            <div style="margin-top: 10px; padding-bottom: 20px;">
                <P>TIPO DE RECLAMO</P> 
                <select id="reclamo-type">
                </select>
                <p style="margin-top: 5px; margin-bottom: 10px;">Describa ABAJO su situación:</p>
                <textarea id="reclamo" type="text" placeholder="Reclamo" autocomplete="reclamo" rows="8" cols="40" required></textarea>
                <input type="text" id="reclamo2" style="color: #a5a4a4">

                <div style="display: flex; gap: 8px; justify-content: space-between; margin-top: 10px; width: 100%; box-sizing: border-box;">
                    <div onclick="cancelar()" style="width: 47%; font-size: 10px; padding: 8px 5px; background: #e51212; color: white; border: none; border-radius: 7px; cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 32px; font-weight: 600;">CANCELAR</div>
                    <div onclick="envia_reclamo()" style="width: 47%; font-size: 10px; padding: 8px 5px; background: #129be5; color: white; border: none; border-radius: 7px; cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; min-height: 32px; font-weight: 600;">ENVIAR</div>
                </div>
                
                <div id="reclamo-confirmation" class="reclamo-confirmation" style="display:hidden; flex-direction: column; text-align: center;">
                    <span>Su reclamo ha sido enviado</span>
                    <img src="img/aprobado.png" alt="Aprobado" class="aprobado-icon" />
                </div>
            </div>
        </div>
        
        <!-- Contenedor horizontal para los 3 botones: home, mis reclamos y micrófono -->
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 20px; margin-bottom: 20px; padding: 0 5px;">
            <!-- Botón home a la izquierda -->
            <div style="display: flex; flex-direction: column; align-items: center; width: 33.33%; text-align: center; padding: 10px; border-radius: 10px; background-color: rgba(18, 155, 229, 0.05);">
                <a href="home.html" class="home-icon" aria-label="Ir al inicio">
                    <svg height="80" width="80" xmlns="http://www.w3.org/2000/svg"><circle r="20" cx="40" cy="40" fill="white" /></svg>
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#129be5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" style="transform: translateX(-55px);"><path d="M3 12L12 3l9 9"/><path d="M9 21V9h6v12"/></svg>
                </a>
                <span style="color: #1E3A8A; font-size: 11px; font-weight: bold; text-align: center; margin-top: 5px;">volver al inicio</span>
            </div>
            
            <!-- Botón Mis Reclamos en el centro -->
            <div style="display: flex; flex-direction: column; align-items: center; width: 33.33%; text-align: center; padding: 10px; border-radius: 10px; background-color: rgba(18, 155, 229, 0.05); margin: 0 5px;">
                <a href="mis-reclamos.html" aria-label="Ver mis reclamos" style="cursor: pointer;">
                    <svg height="80" width="80" xmlns="http://www.w3.org/2000/svg"><circle r="20" cx="40" cy="40" fill="white" /></svg>
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#129be5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" style="transform: translateX(-55px);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
                </a>
                <span style="color: #1E3A8A; font-size: 11px; font-weight: bold; text-align: center; margin-top: 5px;">mis reclamos</span>
            </div>
            
            <!-- Micrófono a la derecha -->
            <div style="display: flex; flex-direction: column; align-items: center; width: 33.33%; text-align: center; padding: 10px; border-radius: 10px; background-color: rgba(18, 155, 229, 0.05);">
                <div class="mic-container" id="mic-container" onclick="toggleRecording()" style="cursor: pointer;">
                    <svg height="80" width="80" xmlns="http://www.w3.org/2000/svg"><circle r="20" cx="40" cy="40" fill="white" /></svg>
                    <img src="img/microphone.png" width="48" id="mic-icon" style="transform: translateX(-16px);">
                    <span id="recording-text" style="display:none; color: #00cc00; font-weight: bold; margin-top: 4px;">grabando</span>
                </div>
                <span style="color: #1E3A8A; font-size: 11px; font-weight: bold; text-align: center; margin-top: 5px;">grabar audio</span>
            </div>
        </div>
        <script src="cordova.js"></script>
        <script src="js/api.js"></script>
        <script src="js/behaviour.js"></script>
        <script>
            let isRecording = false;

            function toggleRecording() {
                const micContainer = document.getElementById('mic-container');
                const recordingText = document.getElementById('recording-text');

                if (!window.plugins || !window.plugins.speechRecognition) {
                    alert("Speech Recognition plugin not available.");
                    return;
                }

                if (!isRecording) {
                    window.plugins.speechRecognition.hasPermission(function (hasPermission) {
                        if (!hasPermission) {
                            window.plugins.speechRecognition.requestPermission(function () {
                                startListening();
                            }, function (err) {
                                alert("Permission denied: " + err);
                            });
                        } else {
                            startListening();
                        }
                    }, function (err) {
                        alert("Error checking permission: " + err);
                    });

                    function startListening() {
                        window.plugins.speechRecognition.startListening(function (matches) {
                            if (matches && matches.length > 0) {
                                document.getElementById("reclamo2").value = matches[0];
                            }
                        }, function (err) {
                            console.error("Speech recognition error: ", err);
                        }, {
                            language: "es-ES",
                            showPopup: false,
                            showPartial: true
                        });

                        micContainer.classList.add('recording');
                        recordingText.style.display = 'block';
                        isRecording = true;
                    }
                } else {
                    window.plugins.speechRecognition.stopListening(function () {
                        micContainer.classList.remove('recording');
                        recordingText.style.display = 'none';
                        isRecording = false;

                        // Append recognized text to reclamo textarea
                        var reclamo = document.getElementById("reclamo");
                        var reclamo2 = document.getElementById("reclamo2");
                        if (reclamo.value != "") {
                            reclamo.value = reclamo.value + ".\n" + reclamo2.value;
                        } else {
                            reclamo.value = reclamo2.value;
                        }
                        reclamo2.value = "";
                    }, function (err) {
                        console.error("Error stopping speech recognition: ", err);
                    });
                }
            }

            async function envia_reclamo() {
                try {
                    const tipo = document.getElementById('reclamo-type').value;
                    const reclamo = document.getElementById('reclamo').value;
                    
                    if (tipo == "") {
                        alert("Debe seleccionar tipo de reclamo");
                        document.getElementById('reclamo-type').focus();
                        return;
                    }   
                    if (reclamo == "") {
                        alert("Debe ingresar reclamo");
                        document.getElementById('reclamo').focus();
                        return;
                    }
                    
                    // Mostrar indicador de carga
                    const enviarBtn = document.querySelector('[onclick="envia_reclamo()"]');
                    const textoOriginal = enviarBtn.textContent;
                    enviarBtn.textContent = 'ENVIANDO...';
                    enviarBtn.style.opacity = '0.7';
                    enviarBtn.style.pointerEvents = 'none';
                    
                    console.log("Enviando reclamo:", { tipo, reclamo });
                    
                    // Enviar reclamo a la API
                    const res = await post_reclamo(reclamo, tipo);
                    
                    console.log("Respuesta de post_reclamo:", res);
                    
                    // Mantener "ENVIANDO..." por 3 segundos antes de restaurar
                    setTimeout(() => {
                        // Restaurar botón después de 3 segundos
                        enviarBtn.textContent = textoOriginal;
                        enviarBtn.style.opacity = '1';
                        enviarBtn.style.pointerEvents = 'auto';
                    }, 3000);
                    
                    // Verificar respuesta
                    if (!res || res.error) {
                        console.error("Error en respuesta del servidor:", res);
                        
                        // En caso de error, restaurar inmediatamente el botón
                        enviarBtn.textContent = textoOriginal;
                        enviarBtn.style.opacity = '1';
                        enviarBtn.style.pointerEvents = 'auto';
                        
                        if (res && res.error) {
                            alert("Error del servidor: " + res.error);
                        } else {
                            alert("Error: No se recibió respuesta válida del servidor");
                        }
                        return;
                    }
                    
                    // Si llegamos aquí, el reclamo se envió exitosamente
                    console.log("Reclamo enviado exitosamente a la base de datos");
                    
                    // Mostrar confirmación
                    const confirmationDiv = document.getElementById('reclamo-confirmation');
                    confirmationDiv.style.display = 'block';
                    
                    setTimeout(() => {
                        confirmationDiv.style.animation = 'moveUpAndFade 2s forwards';
                        setTimeout(() => {
                            confirmationDiv.style.display = 'none';
                            // Limpiar formulario después de animación
                            document.getElementById('reclamo').value = '';
                            document.getElementById('reclamo-type').selectedIndex = 0;
                        }, 2000);
                    }, 3000);
                    
                } catch (error) {
                    console.error("Error al enviar reclamo:", error);
                    
                    // Restaurar botón en caso de error
                    const enviarBtn = document.querySelector('[onclick="envia_reclamo()"]');
                    if (enviarBtn) {
                        enviarBtn.textContent = 'ENVIAR';
                        enviarBtn.style.opacity = '1';
                        enviarBtn.style.pointerEvents = 'auto';
                    }
                    
                    // Determinar tipo de error
                    let mensajeError = "Error desconocido";
                    
                    if (error.message && error.message.includes('HTTP error')) {
                        mensajeError = "Error de conexión con el servidor. Verificar conexión a internet.";
                    } else if (error.message && error.message.includes('Failed to fetch')) {
                        mensajeError = "No se pudo conectar con el servidor. Verificar conexión a internet.";
                    } else if (error.message) {
                        mensajeError = error.message;
                    }
                    
                    alert("Error al enviar reclamo: " + mensajeError + "\n\nIntente nuevamente.");
                }
            }

            function cancelar() {
                try {
                    abre_pag("home.html");
                } catch (e) {
                    alert("ERROR: " + e)
                }
            }

            async function buscar_tipo_reclamo() {
                try {
                    const select = document.getElementById('reclamo-type');
                    if (!select) {
                        console.error('Select element not found');
                        return;
                    }
                    
                    select.innerHTML = '';
                    
                    // Agregar opción por defecto
                    const defaultOption = document.createElement('option');
                    defaultOption.value = '';
                    defaultOption.textContent = 'Seleccione un tipo de reclamo';
                    defaultOption.disabled = true;
                    defaultOption.selected = true;
                    select.appendChild(defaultOption);
                    
                    // Siempre cargar opciones de fallback primero
                    const fallbackOptions = [
                        { id: '1', nombre: 'RECLAMO' },
                        { id: '2', nombre: 'COMENTARIO/FELICITACION' },
                        { id: '3', nombre: 'SUGERENCIA' },
                        { id: '4', nombre: 'CONSULTA' }
                    ];
                    
                    fallbackOptions.forEach(tipo => {
                        const option = document.createElement('option');
                        option.value = tipo.id;
                        option.textContent = tipo.nombre;
                        select.appendChild(option);
                    });
                    
                    console.log('Fallback options loaded, total options:', select.options.length);
                    
                    // Intentar obtener opciones del servidor
                    try {
                        const res = await get_tipo_reclamo();
                        if (res && res.length > 0) {
                            // Limpiar y volver a cargar con datos del servidor
                            select.innerHTML = '';
                            
                            // Re-agregar opción por defecto
                            const serverDefaultOption = document.createElement('option');
                            serverDefaultOption.value = '';
                            serverDefaultOption.textContent = 'Seleccione un tipo de reclamo';
                            serverDefaultOption.disabled = true;
                            serverDefaultOption.selected = true;
                            select.appendChild(serverDefaultOption);
                            
                            res.forEach(tipo => {
                                const option = document.createElement('option');
                                option.value = tipo.id;
                                option.textContent = tipo.nombre;
                                select.appendChild(option);
                            });
                            console.log("Opciones del servidor cargadas: " + JSON.stringify(res));
                        }
                    } catch (serverError) {
                        console.log("Error al obtener tipos del servidor, usando fallback:", serverError);
                    }
                    
                    // Agregar evento de cambio para debugging
                    select.addEventListener('change', function() {
                        console.log('Select changed to:', this.value, this.options[this.selectedIndex].text);
                    });
                    
                    // Forzar re-render del select
                    select.style.display = 'none';
                    select.offsetHeight; // Trigger reflow
                    select.style.display = 'block';
                    
                } catch (e) {
                    console.log("ERROR en buscar_tipo_reclamo: " + e);
                    // Último recurso: cargar opciones básicas
                    const select = document.getElementById('reclamo-type');
                    if (select && select.options.length <= 1) {
                        select.innerHTML = '';
                        const options = [
                            { value: '', text: 'Seleccione un tipo de reclamo', disabled: true, selected: true },
                            { value: '1', text: 'RECLAMO' },
                            { value: '2', text: 'COMENTARIO/FELICITACION' }
                        ];
                        
                        options.forEach(opt => {
                            const option = document.createElement('option');
                            option.value = opt.value;
                            option.textContent = opt.text;
                            if (opt.disabled) option.disabled = true;
                            if (opt.selected) option.selected = true;
                            select.appendChild(option);
                        });
                        console.log('Opciones de emergencia cargadas');
                    }
                }
            }

            // New code to dynamically set reclamo-container height
            function adjustReclamoContainerHeight() {
                const container = document.querySelector('.reclamo-container');
                if (container) {
                    const offsetTop = container.getBoundingClientRect().top;
                    const viewportHeight = window.innerHeight;
                    const newHeight = viewportHeight - offsetTop - 10; // Reducido el padding bottom
                    container.style.height = newHeight + 'px';
                    container.style.overflowY = 'auto'; // Permitir scroll si es necesario
                }
            }

            // Función para reajustar cuando cambian los elementos visibles
            function reajustarAltura() {
                setTimeout(() => {
                    adjustReclamoContainerHeight();
                }, 100); // Pequeño delay para que las animaciones terminen
            }

            window.addEventListener('load', adjustReclamoContainerHeight);
            window.addEventListener('resize', adjustReclamoContainerHeight);
            
            // Asegurar que la función se ejecute cuando el DOM esté listo
            document.addEventListener('DOMContentLoaded', function() {
                console.log('DOM loaded, executing buscar_tipo_reclamo');
                buscar_tipo_reclamo();
            });
            
            // También ejecutar después de un breve delay para casos edge
            setTimeout(function() {
                const select = document.getElementById('reclamo-type');
                if (select && select.options.length <= 1) {
                    console.log('Secondary execution of buscar_tipo_reclamo');
                    buscar_tipo_reclamo();
                }
            }, 1000);
        </script>
    </body>
</html>
